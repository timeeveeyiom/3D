<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>裸眼 3D — 高度立體立方體範例（模組版）</title>
<style>
html, body {margin:0; height:100%; background:#000; overflow:hidden; font-family:system-ui;}
#hud{position:fixed;left:12px;top:12px;background:rgba(0,0,0,0.5);padding:8px 12px;border-radius:8px;color:#fff;font-size:13px; z-index:10;}
button{background:#111;border:1px solid #333;color:#fff;padding:6px 10px;border-radius:8px;cursor:pointer;margin-left:6px}
</style>
</head>
<body>
<div id="hud">狀態：滑鼠移動或啟用攝影機控制視角 <button id="btnCam">啟用攝影機</button></div>
<script type="module">
import * as THREE from 'https://unpkg.com/three@0.158.0/build/three.module.js';
import { OrbitControls } from 'https://unpkg.com/three@0.158.0/examples/jsm/controls/OrbitControls.js';
import { EffectComposer } from 'https://unpkg.com/three@0.158.0/examples/jsm/postprocessing/EffectComposer.js';
import { RenderPass } from 'https://unpkg.com/three@0.158.0/examples/jsm/postprocessing/RenderPass.js';
import { BokehPass } from 'https://unpkg.com/three@0.158.0/examples/jsm/postprocessing/BokehPass.js';

import { FaceMesh } from 'https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js';
import { Camera } from 'https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js';

// ----- 場景 -----
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 2000);
camera.position.z = 5;
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// ----- 後處理 景深 -----
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bokehPass = new BokehPass(scene, camera, {focus:2.5, aperture:0.025, maxblur:0.02, width:window.innerWidth, height:window.innerHeight});
composer.addPass(bokehPass);

// ----- 光源 -----
const dirLight = new THREE.DirectionalLight(0xffffff, 1);
dirLight.position.set(5,5,5);
scene.add(dirLight);
scene.add(new THREE.AmbientLight(0x404040));

// ----- 立方體 -----
const geometry = new THREE.BoxGeometry(1,1,1);
const material = new THREE.MeshStandardMaterial({color:0x00aaff, metalness:0.5, roughness:0.2});
const cube = new THREE.Mesh(geometry, material);
cube.castShadow = true;
cube.receiveShadow = true;
scene.add(cube);

// ----- 多層背景 -----
const stars = new THREE.Group();
for(let i=0;i<300;i++){
  const starGeo = new THREE.SphereGeometry(Math.random()*0.03,6,6);
  const starMat = new THREE.MeshBasicMaterial({color:0xffffff});
  const star = new THREE.Mesh(starGeo, starMat);
  star.position.set((Math.random()-0.5)*20,(Math.random()-0.5)*20,(Math.random()-0.5)*20-5);
  stars.add(star);
}
scene.add(stars);

// ----- 視差控制 -----
let targetX=0, targetY=0, targetZ=5;
window.addEventListener('mousemove',(e)=>{
  if(cameraRunning) return;
  const nx=(e.clientX/window.innerWidth-0.5)*2;
  const ny=(e.clientY/window.innerHeight-0.5)*2;
  targetX = nx*1.5;
  targetY = -ny*1.0;
});

// ----- 攝影機追蹤 -----
let cameraRunning=false;
let mediaCamera;
const btnCam = document.getElementById('btnCam');
const video = document.createElement('video');
video.style.display='none';
document.body.appendChild(video);

const faceMesh = new FaceMesh({locateFile: (file)=>`https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`});
faceMesh.setOptions({maxNumFaces:1,refineLandmarks:true,minDetectionConfidence:0.6,minTrackingConfidence:0.6});
faceMesh.onResults(onFaceResults);

async function startCam(){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){alert('不支援攝影機');return;}
  mediaCamera = new Camera(video,{onFrame:async()=>{await faceMesh.send({image:video});},width:640,height:480});
  await mediaCamera.start();
  cameraRunning=true;
  btnCam.innerText='停用攝影機';
}
function stopCam(){if(mediaCamera && mediaCamera.stop) mediaCamera.stop(); cameraRunning=false; btnCam.innerText='啟用攝影機';}
btnCam.onclick=()=>{cameraRunning?stopCam():startCam();};

function onFaceResults(results){
  if(!results.multiFaceLandmarks || !results.multiFaceLandmarks.length) return;
  const lm=results.multiFaceLandmarks[0];
  const left=lm[33], right=lm[263];
  const midX=(left.x+right.x)/2; const midY=(left.y+right.y)/2;
  const dx=(midX-0.5)*2, dy=(midY-0.5)*2;
  const dist=Math.hypot(left.x-right.x,left.y-right.y);
  targetX=dx*1.5; targetY=-dy*1.0; targetZ=4+ (0.5-dist)*5;
}

// ----- 動畫 -----
function animate(){
  requestAnimationFrame(animate);
  cube.rotation.x +=0.01; cube.rotation.y+=0.015;
  camera.position.x += (targetX-camera.position.x)*0.08;
  camera.position.y += (targetY-camera.position.y)*0.08;
  camera.position.z += (targetZ-camera.position.z)*0.08;
  camera.lookAt(0,0,0);
  stars.rotation.y +=0.0005;
  composer.render();
}
animate();

window.addEventListener('resize',()=>{
  camera.aspect=window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth,window.innerHeight);
  composer.setSize(window.innerWidth,window.innerHeight);
});
</script>
</body>
</html>
